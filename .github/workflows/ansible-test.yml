---
name: Ansible Collection CI Test

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 6 * * *"

jobs:
  build:
    name: Build Collection Artifact
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ github.run_id }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install ansible --disable-pip-version-check

      - name: Build Ansible Collection
        run: ansible-galaxy collection build --force

      - name: List build directory contents
        run: ls -la

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: collection-tarball
          path: "*.tar.gz"
          retention-days: 10

  sanity:
    name: Sanity Tests (Ⓐ ${{ matrix.ansible }})
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - ansible: stable-2.16
            python: "3.12"
          - ansible: stable-2.17
            python: "3.12"
          - ansible: stable-2.18
            python: "3.12"
          - ansible: stable-2.19
            python: "3.12"
          - ansible: stable-2.20
            python: "3.12"
          - ansible: devel
            python: "3.13"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Sanity Tests
        uses: ansible-community/ansible-test-gh-action@release/v1
        with:
          ansible-core-version: ${{ matrix.ansible }}
          origin-python-version: ${{ matrix.python }}
          testing-type: sanity
          pull-request-change-detection: false

  check:
    name: Check All Tests
    needs:
      - sanity
    runs-on: ubuntu-latest

    steps:
      - name: Ensure All Tests Passed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
